
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172b46">
<title>Registro de Entregas - Pañol</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#eef2f6;color:#243247;
 font-family:Arial,sans-serif
}
header{background:#172b46;color:white;padding:22px 18px}
header h1{font-size:21px;margin:0 0 6px}
header p{margin:0;color:#c5d4e6;font-size:13px}
main{max-width:650px;margin:auto;padding:15px}
.card{
 background:white;padding:18px;border-radius:14px;
 margin-bottom:15px;box-shadow:0 3px 12px #172b4610
}
h2{font-size:18px;margin:0 0 15px}
label{
 display:block;font-size:13px;font-weight:bold;
 margin:13px 0 6px
}
input,textarea{
 width:100%;padding:12px;border:1px solid #ccd5df;
 border-radius:9px;font-size:15px;background:white
}
button{
 border:0;border-radius:9px;padding:13px;
 font-size:14px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5}
.primary{
 background:#24558a;color:white;width:100%;margin-top:18px
}
.secondary{
 background:#e5edf6;color:#172b46;width:100%;margin-top:10px
}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tabs button{flex:1;background:#dce5ef;color:#172b46}
.tabs button.active{background:#172b46;color:white}
.hidden{display:none}
.stats{display:flex;gap:10px;margin-bottom:15px}
.stat{
 background:#e9f0f8;padding:13px;border-radius:10px;
 text-align:center;flex:1
}
.stat strong{
 display:block;font-size:22px;color:#172b46
}
.stat span{font-size:12px;color:#657386}
.record{
 border:1px solid #e0e6ed;border-radius:10px;
 padding:13px;margin-bottom:10px;overflow-wrap:anywhere
}
.record h3{margin:0 0 7px;font-size:16px}
.record p{font-size:13px;margin:6px 0;color:#536276}
.difference{color:#bd6b19;font-weight:bold}
.ok{color:#23804b;font-weight:bold}
.record img{
 width:100%;max-height:220px;object-fit:contain;margin-top:8px
}
#estado{font-size:13px;color:#536276;margin-top:10px}
#estadoOCR{
 font-size:13px;color:#24558a;margin-top:10px;
 white-space:pre-wrap
}
.progress{
 width:100%;height:9px;background:#e5edf6;
 border-radius:10px;overflow:hidden;margin-top:10px
}
#barraOCR{
 width:0%;height:100%;background:#24558a;
 transition:width .2s
}
</style>
</head>

<body>
<header>
 <h1>📦 Registro de Entregas</h1>
 <p>Control personal de movimientos del pañol</p>
</header>

<main>

<div class="stats">
 <div class="stat">
  <strong id="total">0</strong>
  <span>Entregas</span>
 </div>
 <div class="stat">
  <strong id="diff">0</strong>
  <span>Diferencias</span>
 </div>
</div>

<div class="tabs">
 <button id="tabNew" class="active" type="button">＋ Entrega</button>
 <button id="tabHistory" type="button">☷ Historial</button>
</div>

<section id="new">
<div class="card">
<h2>Nueva entrega</h2>

<form id="formEntrega">

<label>Número de parte o tarea</label>
<input id="parte" required placeholder="Ej: Tarea 1250">

<label>Nombre del repuesto</label>
<input id="repuesto" required placeholder="Nombre del repuesto">

<label>Fotografía de la etiqueta</label>
<input id="foto" type="file" accept="image/*" capture="environment">

<button type="button" class="secondary" id="btnOCR">
 RECONOCER TEXTO DE LA FOTO
</button>

<div class="progress">
 <div id="barraOCR"></div>
</div>
<p id="estadoOCR">Seleccioná una fotografía para comenzar.</p>

<label>Texto reconocido de la etiqueta (editable)</label>
<textarea id="texto" rows="6"
 placeholder="El texto reconocido aparecerá aquí. También podés escribir o corregirlo manualmente."></textarea>

<label>Cantidad entregada</label>
<input id="entregada" type="number" min="0" step="any" required>

<label>Stock del sistema</label>
<input id="sistema" type="number" min="0" step="any" required>

<label>Stock físico observado</label>
<input id="fisico" type="number" min="0" step="any" required>

<label>Usuario / pañolero</label>
<input id="usuario" placeholder="Nombre del responsable">

<button class="primary" id="guardar" type="submit">
 GUARDAR ENTREGA
</button>

<p id="estado" role="status"></p>
</form>
</div>
</section>

<section id="history" class="hidden">
<div class="card">
<h2>Historial de entregas</h2>

<input id="buscar" placeholder="Buscar repuesto, tarea o texto...">

<div id="lista" style="margin-top:15px"></div>

<button class="secondary" id="exportar" type="button">
 DESCARGAR RESPALDO JSON
</button>

<label>Restaurar copia de seguridad</label>
<input id="archivoRespaldo" type="file" accept=".json,application/json">

<button class="secondary" id="importar" type="button">
 RESTAURAR RESPALDO
</button>
</div>
</section>

</main>

<script>
"use strict";

const DB_NAME="PanolRegistroDB";
const DB_VERSION=1;
const STORE_NAME="entregas";

let db=null;
let registros=[];
let workerOCR=null;
let cargandoOCR=null;

const $=id=>document.getElementById(id);

/* BASE DE DATOS */

function abrirDB(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open(DB_NAME,DB_VERSION);

  request.onupgradeneeded=()=>{
   const database=request.result;
   if(!database.objectStoreNames.contains(STORE_NAME)){
    database.createObjectStore(STORE_NAME,{keyPath:"id"});
   }
  };

  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}

function guardarDB(registro){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE_NAME,"readwrite");
  tx.objectStore(STORE_NAME).put(registro);
  tx.oncomplete=()=>resolve();
  tx.onerror=()=>reject(tx.error);
  tx.onabort=()=>reject(tx.error);
 });
}

function leerTodos(){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE_NAME,"readonly");
  const request=tx.objectStore(STORE_NAME).getAll();
  request.onsuccess=()=>resolve(request.result||[]);
  request.onerror=()=>reject(request.error);
 });
}

async function cargar(){
 try{
  db=await abrirDB();
  registros=await leerTodos();
  ordenarRegistros();
  actualizar();
  $("estado").textContent="Almacenamiento local preparado.";
 }catch(error){
  console.error(error);
  $("estado").textContent="Error al abrir almacenamiento: "+error.message;
  alert("No se pudo preparar el almacenamiento. No cargues entregas todavía.");
 }
}

function ordenarRegistros(){
 registros.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
}

function actualizar(){
 $("total").textContent=registros.length;
 $("diff").textContent=registros.filter(
  r=>Number(r.sistema)!==Number(r.fisico)
 ).length;
}

/* PESTAÑAS */

function mostrarTab(tab){
 $("new").classList.toggle("hidden",tab!=="new");
 $("history").classList.toggle("hidden",tab!=="history");
 $("tabNew").classList.toggle("active",tab==="new");
 $("tabHistory").classList.toggle("active",tab==="history");

 if(tab==="history")render();
}

$("tabNew").addEventListener("click",()=>mostrarTab("new"));
$("tabHistory").addEventListener("click",()=>mostrarTab("history"));

/* MOTOR OCR */

async function obtenerWorker(){
 if(workerOCR)return workerOCR;
 if(cargandoOCR)return cargandoOCR;

 cargandoOCR=(async()=>{
  if(!window.Tesseract){
   throw new Error("No se pudo cargar Tesseract. Revisá la conexión a internet.");
  }

  workerOCR=await Tesseract.createWorker("spa+eng",1,{
   logger:mensaje=>{
    if(mensaje.status){
     let porcentaje=0;

     if(typeof mensaje.progress==="number"){
      porcentaje=Math.round(mensaje.progress*100);
     }

     $("barraOCR").style.width=porcentaje+"%";
     $("estadoOCR").textContent=
      mensaje.status+
      (porcentaje?" ("+porcentaje+"%)":"");
    }
   }
  });

  return workerOCR;
 })();

 try{
  return await cargandoOCR;
 }catch(error){
  workerOCR=null;
  throw error;
 }finally{
  cargandoOCR=null;
 }
}

$("btnOCR").addEventListener("click",async()=>{
 const archivo=$("foto").files[0];
 const boton=$("btnOCR");

 if(!archivo){
  alert("Primero sacá o seleccioná una fotografía de la etiqueta.");
  return;
 }

 if(!archivo.type.startsWith("image/")){
  alert("El archivo seleccionado no es una imagen.");
  return;
 }

 boton.disabled=true;
 boton.textContent="PROCESANDO FOTO...";
 $("barraOCR").style.width="0%";
 $("estadoOCR").textContent="Preparando reconocimiento...";

 try{
  const worker=await obtenerWorker();

  $("estadoOCR").textContent=
   "Analizando la etiqueta. Esto puede tardar unos segundos...";

  const resultado=await worker.recognize(archivo);
  const textoReconocido=resultado.data.text.trim();

  $("barraOCR").style.width="100%";

  if(textoReconocido){
   $("texto").value=textoReconocido;
   $("estadoOCR").textContent=
    "¡Reconocimiento terminado! Revisá y corregí el texto si es necesario.";
  }else{
   $("estadoOCR").textContent=
    "No se encontró texto. Probá con una foto más nítida y bien iluminada.";
  }

 }catch(error){
  console.error(error);
  $("estadoOCR").textContent=
   "Error al reconocer texto: "+error.message;
  alert("No se pudo procesar la fotografía. Revisá la conexión a internet.");
 }finally{
  boton.disabled=false;
  boton.textContent="RECONOCER TEXTO DE LA FOTO";
 }
});

$("foto").addEventListener("change",()=>{
 $("barraOCR").style.width="0%";
 $("estadoOCR").textContent=$("foto").files.length?
  "Fotografía seleccionada. Tocá RECONOCER TEXTO DE LA FOTO.":
  "Seleccioná una fotografía para comenzar.";
});

/* GUARDAR ENTREGA */

$("formEntrega").addEventListener("submit",async e=>{
 e.preventDefault();

 if(!db){
  alert("El almacenamiento todavía no está disponible.");
  return;
 }

 const boton=$("guardar");
 boton.disabled=true;
 boton.textContent="GUARDANDO...";
 $("estado").textContent="Guardando entrega y fotografía...";

 try{
  const archivo=$("foto").files[0]||null;

  if(archivo && !archivo.type.startsWith("image/")){
   throw new Error("El archivo seleccionado no es una imagen.");
  }

  const registro={
   id:Date.now(),
   fecha:new Date().toISOString(),
   parte:$("parte").value.trim(),
   repuesto:$("repuesto").value.trim(),
   texto:$("texto").value.trim(),
   foto:archivo,
   entregada:Number($("entregada").value),
   sistema:Number($("sistema").value),
   fisico:Number($("fisico").value),
   usuario:$("usuario").value.trim()
  };

  await guardarDB(registro);

  registros=await leerTodos();
  ordenarRegistros();
  actualizar();

  $("formEntrega").reset();
  $("barraOCR").style.width="0%";
  $("estadoOCR").textContent="Seleccioná una fotografía para comenzar.";
  $("estado").textContent="Entrega guardada correctamente.";

  alert("¡Entrega guardada correctamente!");
  mostrarTab("history");

 }catch(error){
  console.error(error);
  $("estado").textContent="ERROR: "+error.message;
  alert("No se pudo guardar la entrega: "+error.message);
 }finally{
  boton.disabled=false;
  boton.textContent="GUARDAR ENTREGA";
 }
});

/* HISTORIAL Y BÚSQUEDA */

function render(){
 const q=$("buscar").value.toLowerCase();
 const lista=$("lista");
 lista.innerHTML="";

 const encontrados=registros.filter(r=>
  (
   (r.parte||"")+" "+
   (r.repuesto||"")+" "+
   (r.texto||"")+" "+
   (r.usuario||"")
  ).toLowerCase().includes(q)
 );

 if(!encontrados.length){
  lista.textContent="No hay registros para mostrar.";
  return;
 }

 encontrados.forEach(r=>{
  const div=document.createElement("div");
  div.className="record";

  const diferencia=Number(r.sistema)-Number(r.fisico);

  const titulo=document.createElement("h3");
  titulo.textContent=r.repuesto||"Sin nombre";

  const fecha=document.createElement("p");
  fecha.textContent="Fecha: "+new Date(r.fecha).toLocaleString("es-AR");

  const datos=document.createElement("p");
  datos.textContent=
   "Parte/tarea: "+(r.parte||"")+
   " | Entregado: "+r.entregada+
   " | Sistema: "+r.sistema+
   " | Físico: "+r.fisico;

  const dif=document.createElement("p");
  dif.className=diferencia!==0?"difference":"ok";
  dif.textContent=diferencia!==0?
   "Diferencia: "+diferencia:"Sin diferencia";

  const usuario=document.createElement("p");
  usuario.textContent="Usuario: "+(r.usuario||"No indicado");

  const texto=document.createElement("p");
  texto.textContent="Etiqueta: "+(r.texto||"Sin texto");

  div.append(titulo,fecha,datos,dif,usuario,texto);

  if(r.foto){
   const img=document.createElement("img");

   if(r.foto instanceof Blob){
    const url=URL.createObjectURL(r.foto);
    img.src=url;
    img.onload=()=>URL.revokeObjectURL(url);
   }else if(typeof r.foto==="string"){
    img.src=r.foto;
   }

   img.alt="Fotografía de etiqueta";
   div.appendChild(img);
  }

  lista.appendChild(div);
 });
}

$("buscar").addEventListener("input",render);

/* EXPORTAR RESPALDO */

async function blobADataURL(blob){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(reader.error);
  reader.readAsDataURL(blob);
 });
}

$("exportar").addEventListener("click",async()=>{
 try{
  const datos=await leerTodos();
  const salida=[];

  for(const r of datos){
   let foto=null;

   if(r.foto instanceof Blob){
    foto=await blobADataURL(r.foto);
   }else{
    foto=r.foto||null;
   }

   salida.push({...r,foto});
  }

  const blob=new Blob(
   [JSON.stringify(salida,null,2)],
   {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="respaldo_panol.json";
  a.click();

  setTimeout(()=>URL.revokeObjectURL(url),3000);

 }catch(error){
  alert("Error al crear respaldo: "+error.message);
 }
});

/* RESTAURAR RESPALDO */

function dataURLABlob(dataURL){
 const partes=dataURL.split(",");
 const tipo=partes[0].match(/:(.*?);/)[1];
 const binario=atob(partes[1]);
 const bytes=new Uint8Array(binario.length);

 for(let i=0;i<binario.length;i++){
  bytes[i]=binario.charCodeAt(i);
 }

 return new Blob([bytes],{type:tipo});
}

$("importar").addEventListener("click",async()=>{
 const archivo=$("archivoRespaldo").files[0];

 if(!archivo){
  alert("Primero seleccioná un archivo JSON.");
  return;
 }

 if(!confirm("¿Querés restaurar las entregas de esta copia? Los registros actuales se conservarán, salvo los que tengan el mismo identificador.")){
  return;
 }

 try{
  const contenido=await archivo.text();
  const datos=JSON.parse(contenido);

  if(!Array.isArray(datos)){
   throw new Error("El archivo no tiene el formato esperado.");
  }

  for(const r of datos){
   if(!r || !r.id)continue;

   let foto=r.foto||null;

   if(typeof foto==="string" && foto.startsWith("data:")){
    foto=dataURLABlob(foto);
   }

   await guardarDB({...r,foto});
  }

  registros=await leerTodos();
  ordenarRegistros();
  actualizar();
  render();

  alert("Respaldo restaurado correctamente.");

 }catch(error){
  console.error(error);
  alert("No se pudo restaurar el respaldo: "+error.message);
 }
});

/* INICIAR */

cargar();

</script>
</body>
</html>
