<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de entregas - Pañol</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: #eef1f5;
  color: #263445;
  font-family: Arial, sans-serif;
}

header {
  background: #263f5c;
  color: white;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 16px;
}

h1 { font-size: 22px; margin: 0; }
h2 { font-size: 19px; }

.card {
  background: white;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
  box-shadow: 0 2px 7px #00000012;
}

label {
  display: block;
  margin-top: 12px;
  margin-bottom: 5px;
  font-weight: bold;
  font-size: 14px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #cbd3dc;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

textarea { min-height: 75px; }

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 8px;
  background: #315d88;
  color: white;
  font-size: 15px;
  font-weight: bold;
}

button.secondary { background: #526579; }
button.danger { background: #a33d3d; }

#estado {
  padding: 10px;
  margin-top: 12px;
  border-radius: 8px;
  background: #edf3f8;
  font-size: 14px;
}

.entrega {
  border: 1px solid #dce2e9;
  border-radius: 9px;
  padding: 12px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

.entrega img {
  display: block;
  max-width: 100%;
  max-height: 260px;
  object-fit: contain;
  margin-top: 10px;
  border-radius: 8px;
}

.dato { margin: 6px 0; font-size: 14px; }
.fecha { color: #68798a; font-size: 12px; }
#archivoRespaldo { display: none; }

#panelEscaner {
  display: none;
  margin-top: 14px;
  padding: 12px;
  background: #edf3f8;
  border-radius: 10px;
}

#videoEscaner {
  width: 100%;
  max-height: 350px;
  background: #111;
  border-radius: 8px;
}

.aviso {
  font-size: 13px;
  color: #526579;
}
</style>
</head>

<body>

<header>
  <h1>REGISTRO DE ENTREGAS</h1>
  <p>Pañol - Registro personal</p>
</header>

<section class="card">
  <h2>Nueva entrega</h2>

  <form id="formEntrega">

    <label for="parte">Número de parte / tarea</label>
    <input id="parte" type="text" placeholder="Número de parte o tarea">

    <label for="repuesto">Repuesto</label>
    <input id="repuesto" type="text" required placeholder="Nombre del repuesto">

    <label for="codigoBarras">Código de barras / QR (opcional)</label>
    <input id="codigoBarras" type="text" placeholder="Escaneá o escribí el código">

    <button type="button" id="abrirEscaner">
      ESCANEAR CÓDIGO CON LA CÁMARA
    </button>

    <div id="panelEscaner">
      <p><strong>Apuntá la cámara al código del repuesto.</strong></p>
      <video id="videoEscaner" muted playsinline></video>
      <p id="estadoEscaner" class="aviso">Iniciando cámara...</p>
      <button type="button" class="danger" id="cerrarEscaner">
        CERRAR ESCÁNER
      </button>
    </div>

    <label for="foto">Fotografía de la etiqueta</label>
    <input id="foto" type="file" accept="image/*" capture="environment">

    <label for="texto">Texto leído de la etiqueta</label>
    <textarea id="texto" placeholder="Podés escribir o corregir el texto manualmente"></textarea>

    <label for="entregada">Cantidad entregada</label>
    <input id="entregada" type="number" min="0" step="any">

    <label for="sistema">Stock en sistema observado</label>
    <input id="sistema" type="number" step="any">

    <label for="fisico">Stock físico observado</label>
    <input id="fisico" type="number" step="any">

    <label for="usuario">Usuario</label>
    <input id="usuario" type="text" placeholder="Nombre del usuario">

    <button type="submit">GUARDAR ENTREGA</button>
  </form>

  <div id="estado">Preparando almacenamiento...</div>
</section>

<section class="card">
  <h2>Historial de entregas</h2>

  <input id="buscar" type="search"
  placeholder="Buscar por repuesto, parte o código">

  <div id="historial">Cargando historial...</div>

  <button class="secondary" id="exportar">
    DESCARGAR RESPALDO JSON
  </button>

  <input id="archivoRespaldo" type="file" accept=".json,application/json">

  <button class="secondary" id="importar">
    RESTAURAR RESPALDO JSON
  </button>
</section>

<!-- Biblioteca para leer códigos de barras y QR -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>

<script>
const DB_NAME = "PanolRegistroDB";
const STORE_NAME = "entregas";

let db;
let lector;
let controlesEscaner = null;

const $ = id => document.getElementById(id);

function mensaje(texto) {
  $("estado").textContent = texto;
}

function abrirDB() {
  return new Promise((resolve, reject) => {
    const solicitud = indexedDB.open(DB_NAME);

    solicitud.onupgradeneeded = () => {
      const base = solicitud.result;

      if (!base.objectStoreNames.contains(STORE_NAME)) {
        base.createObjectStore(STORE_NAME, { keyPath: "id" });
      }
    };

    solicitud.onsuccess = () => {
      db = solicitud.result;

      if (!db.objectStoreNames.contains(STORE_NAME)) {
        reject(new Error("No se encontró la tabla de entregas."));
        return;
      }

      resolve(db);
    };

    solicitud.onerror = () => reject(solicitud.error);
  });
}

function guardarDB(registro) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).put(registro);

    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

function leerTodos() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, "readonly");
    const solicitud = tx.objectStore(STORE_NAME).getAll();

    solicitud.onsuccess = () => resolve(solicitud.result);
    solicitud.onerror = () => reject(solicitud.error);
  });
}

function escapar(valor) {
  return String(valor ?? "").replace(/[&<>"']/g, letra => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[letra]);
}

function fechaBonita(fecha) {
  if (!fecha) return "Fecha no disponible";

  const d = new Date(fecha);
  if (isNaN(d.getTime())) return String(fecha);

  return d.toLocaleString("es-AR");
}

async function mostrarHistorial() {
  const registros = await leerTodos();
  const filtro = $("buscar").value.trim().toLowerCase();

  registros.sort((a, b) =>
    new Date(b.fecha || 0) - new Date(a.fecha || 0)
  );

  const filtrados = registros.filter(r =>
    String(r.repuesto || "").toLowerCase().includes(filtro) ||
    String(r.parte || "").toLowerCase().includes(filtro) ||
    String(r.codigoBarras || "").toLowerCase().includes(filtro)
  );

  const contenedor = $("historial");
  contenedor.innerHTML = "";

  if (!filtrados.length) {
    contenedor.textContent = "No hay entregas registradas.";
    return;
  }

  filtrados.forEach(r => {
    const tarjeta = document.createElement("div");
    tarjeta.className = "entrega";

    tarjeta.innerHTML = `
      <strong>${escapar(r.repuesto || "Sin nombre")}</strong>
      <div class="fecha">${escapar(fechaBonita(r.fecha))}</div>
      <div class="dato">Parte / tarea: ${escapar(r.parte)}</div>
      <div class="dato">Código de barras / QR: ${escapar(r.codigoBarras || "Sin código")}</div>
      <div class="dato">Cantidad entregada: ${escapar(r.entregada)}</div>
      <div class="dato">Stock sistema: ${escapar(r.sistema)}</div>
      <div class="dato">Stock físico: ${escapar(r.fisico)}</div>
      <div class="dato">Texto etiqueta: ${escapar(r.texto)}</div>
      <div class="dato">Usuario: ${escapar(r.usuario)}</div>
    `;

    if (r.foto) {
      const img = document.createElement("img");

      if (r.foto instanceof Blob) {
        img.src = URL.createObjectURL(r.foto);
      } else if (typeof r.foto === "string") {
        img.src = r.foto;
      }

      img.alt = "Fotografía de etiqueta";
      tarjeta.appendChild(img);
    }

    contenedor.appendChild(tarjeta);
  });
}

// ESCÁNER DE CÓDIGOS

async function abrirEscaner() {
  $("panelEscaner").style.display = "block";
  $("estadoEscaner").textContent = "Preparando cámara...";

  try {
    if (!window.ZXingBrowser) {
      throw new Error("No se pudo cargar el lector. Revisá tu conexión a internet.");
    }

    lector = new ZXingBrowser.BrowserMultiFormatReader();

    controlesEscaner = await lector.decodeFromVideoDevice(
      undefined,
      $("videoEscaner"),
      (resultado, error, controles) => {
        if (resultado) {
          $("codigoBarras").value = resultado.getText();
          $("estadoEscaner").textContent =
            "¡Código leído correctamente!";

          if (controles) {
            controles.stop();
          }

          controlesEscaner = null;
          $("panelEscaner").style.display = "none";
        }
      }
    );

    $("estadoEscaner").textContent =
      "Cámara activa. Apuntá al código.";

  } catch (error) {
    console.error(error);
    $("estadoEscaner").textContent =
      "No se pudo abrir la cámara: " + error.message;
  }
}

function cerrarEscaner() {
  if (controlesEscaner) {
    controlesEscaner.stop();
    controlesEscaner = null;
  }

  $("panelEscaner").style.display = "none";
}

$("abrirEscaner").addEventListener("click", abrirEscaner);
$("cerrarEscaner").addEventListener("click", cerrarEscaner);

// GUARDAR ENTREGA

$("formEntrega").addEventListener("submit", async e => {
  e.preventDefault();

  try {
    mensaje("Guardando entrega...");

    const archivo = $("foto").files[0] || null;

    const registro = {
      id: Date.now().toString() + "-" + Math.random().toString(16).slice(2),
      fecha: new Date().toISOString(),
      parte: $("parte").value,
      repuesto: $("repuesto").value,
      codigoBarras: $("codigoBarras").value.trim(),
      foto: archivo,
      texto: $("texto").value,
      entregada: $("entregada").value,
      sistema: $("sistema").value,
      fisico: $("fisico").value,
      usuario: $("usuario").value
    };

    await guardarDB(registro);
    await mostrarHistorial();

    $("formEntrega").reset();
    mensaje("¡Entrega guardada correctamente!");

  } catch (error) {
    console.error(error);
    mensaje("ERROR al guardar: " + error.message);
  }
});

// RESPALDO

function blobADataURL(blob) {
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onload = () => resolve(lector.result);
    lector.onerror = () => reject(lector.error);
    lector.readAsDataURL(blob);
  });
}

function dataURLABlob(dataURL) {
  const partes = dataURL.split(",");
  const tipo = partes[0].match(/:(.*?);/)[1];
  const binario = atob(partes[1]);
  const bytes = new Uint8Array(binario.length);

  for (let i = 0; i < binario.length; i++) {
    bytes[i] = binario.charCodeAt(i);
  }

  return new Blob([bytes], { type: tipo });
}

$("exportar").addEventListener("click", async () => {
  try {
    mensaje("Preparando copia de seguridad...");

    const registros = await leerTodos();
    const respaldo = [];

    for (const r of registros) {
      const copia = { ...r };

      if (copia.foto instanceof Blob) {
        copia.foto = await blobADataURL(copia.foto);
      }

      respaldo.push(copia);
    }

    const contenido = {
      aplicacion: "Registro de entregas del pañol",
      version: 1,
      fechaRespaldo: new Date().toISOString(),
      entregas: respaldo
    };

    const blob = new Blob(
      [JSON.stringify(contenido)],
      { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);
    const enlace = document.createElement("a");

    enlace.href = url;
    enlace.download = "respaldo_panol_" +
      new Date().toISOString().slice(0, 10) + ".json";

    enlace.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    mensaje("Copia de seguridad descargada correctamente.");

  } catch (error) {
    console.error(error);
    mensaje("Error al crear respaldo: " + error.message);
  }
});

// RESTAURAR RESPALDO

$("importar").addEventListener("click", () => {
  $("archivoRespaldo").click();
});

$("archivoRespaldo").addEventListener("change", async e => {
  const archivo = e.target.files[0];
  if (!archivo) return;

  try {
    mensaje("Leyendo copia de seguridad...");

    const contenido = JSON.parse(await archivo.text());

    const registros = Array.isArray(contenido)
      ? contenido
      : contenido.entregas;

    if (!Array.isArray(registros)) {
      throw new Error("El archivo no contiene una lista de entregas válida.");
    }

    if (!confirm(
      "Se van a importar " + registros.length +
      " entregas. Los registros existentes se conservarán. ¿Continuar?"
    )) {
      mensaje("Restauración cancelada.");
      e.target.value = "";
      return;
    }

    let cantidad = 0;

    for (const original of registros) {
      const r = { ...original };

      if (typeof r.foto === "string" &&
          r.foto.startsWith("data:")) {
        r.foto = dataURLABlob(r.foto);
      }

      if (!r.id) {
        r.id = "importado-" + Date.now() + "-" + cantidad;
      }

      await guardarDB(r);
      cantidad++;
    }

    await mostrarHistorial();

    mensaje("Restauración terminada. Entregas importadas: " + cantidad);

    alert("Copia restaurada correctamente.");

  } catch (error) {
    console.error(error);
    mensaje("Error al restaurar: " + error.message);
    alert("No se pudo restaurar: " + error.message);
  }

  e.target.value = "";
});

$("buscar").addEventListener("input", mostrarHistorial);

async function iniciar() {
  try {
    await abrirDB();
    await mostrarHistorial();
    mensaje("Almacenamiento local preparado.");
  } catch (error) {
    console.error(error);
    mensaje("Error al iniciar almacenamiento: " + error.message);
  }
}

iniciar();
</script>

</body>
</html>
